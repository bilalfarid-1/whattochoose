services:
  db:
    image: postgres:16-alpine
    container_name: jobpulse_postgres
    restart: always
    environment:
      POSTGRES_USER: jobpulse_user
      POSTGRES_PASSWORD: jobpulse_password
      POSTGRES_DB: jobpulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpulse_user -d jobpulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: jobpulse_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROJECT_NAME: "JobPulse API"
      VERSION: "1.0.0"
      API_V1_STR: "/api/v1"
      SECRET_KEY: "production-secure-random-token-key-replace-in-env"
      DATABASE_URL: "postgresql://jobpulse_user:jobpulse_password@db:5432/jobpulse_db"
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
    ports:
      - "8000:8000"

volumes:
  postgres_data:
